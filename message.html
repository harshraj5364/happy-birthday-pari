<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Letter For You</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 36px 26px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 1.4rem;
      letter-spacing: -0.3px;
    }
    .badge {
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 3px 10px;
      border-radius: 99px;
      font-weight: 500;
    }
    .letter-box {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 18px;
      padding: 22px;
      border-left: 3px solid #ec4899;
      min-height: 170px;
      line-height: 1.7;
      font-size: 0.95rem;
      color: #e2e8f0;
      white-space: pre-wrap;
    }
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: #ec4899;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }
    .promise {
      margin-top: 20px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(236, 72, 153, 0.08);
      border: 1px dashed rgba(236, 72, 153, 0.3);
      text-align: center;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .footer {
      text-align: center;
      margin-top: 24px;
    }
    .footer a {
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s;
    }
    .footer a:hover { color: #94a3b8; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h2>Dear Pari,</h2>
      <span class="badge">Unfiltered Note</span>
    </div>

    <div class="letter-box">
      <span id="typed-text"></span><span class="cursor" id="cursor"></span>
    </div>

    <div class="promise">
      ⚡ Lifetime Warranty: Valid for emergency life advice, treats, and someone in your corner always.
    </div>

    <div class="footer">
      <a href="index.html">↺ Start from beginning</a>
    </div>
  </div>

  <script>
    const fullMessage = "Happy Birthday!\n\nNever doubt what you are capable of building for yourself. Through all the chaos, arguments, and quiet support, I'm always proud of the person you're turning into.\n\nKeep shining, keep laughing, and have the best year ahead.";
    let index = 0;
    const speed = 32;

    function typeWriter() {
      if (index < fullMessage.length) {
        document.getElementById("typed-text").textContent += fullMessage.charAt(index);
        index++;
        setTimeout(typeWriter, speed);
      } else {
        document.getElementById("cursor").style.display = "none";
      }
    }

    window.addEventListener("load", () => {
      setTimeout(typeWriter, 400);
    });
  </script>
</body>
</html>
