<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      padding: 38px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
    }
    .img-wrap {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto 24px;
    }
    .img-wrap::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #38bdf8, #a855f7);
      z-index: -1;
      animation: spin 6s linear infinite;
    }
    .photo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 3px solid #090d16;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .tag {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      background: rgba(236, 72, 153, 0.15);
      color: #f472b6;
      border: 1px solid rgba(236, 72, 153, 0.3);
      padding: 4px 14px;
      border-radius: 99px;
      margin-bottom: 14px;
    }
    p {
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    .btn {
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      display: block;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #fff;
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="fireworks"></canvas>

  <div class="card">
    <div class="img-wrap">
      <img class="photo" src="IMG-20260423-WA0029.jpg" alt="Pari" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400'">
    </div>
    <div class="tag">Birthday Royalty</div>
    <h1>Happy Birthday! 🎂</h1>
    <p>Another chapter begins. Keep being genuine, chase down your goals, and stop stealing the charger.</p>
    
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="blast()">Pop More Confetti 🎉</button>
      <a href="message.html" class="btn btn-primary">Read Your Letter →</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    let pieces = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function blast() {
      for (let i = 0; i < 45; i++) {
        pieces.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          dx: (Math.random() - 0.5) * 14,
          dy: (Math.random() - 0.5) * 14 - 3,
          r: Math.random() * 4 + 2,
          alpha: 1,
          color: ['#ec4899', '#38bdf8', '#facc15', '#a855f7', '#4ade80'][Math.floor(Math.random() * 5)]
        });
      }
    }
    blast();

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach((p, idx) => {
        p.x += p.dx;
        p.y += p.dy;
        p.dy += 0.22;
        p.alpha -= 0.012;

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (p.alpha <= 0) pieces.splice(idx, 1);
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
