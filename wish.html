<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celebration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #07090e;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      padding: 38px 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.7);
    }
    .ring {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto 22px;
    }
    .ring::before {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899, #38bdf8, #a855f7, #ec4899);
      background-size: 300% 300%;
      animation: rotateGrad 4s linear infinite;
      z-index: -1;
    }
    .photo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 4px solid #07090e;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: rgba(236, 72, 153, 0.15);
      color: #f472b6;
      border: 1px solid rgba(236, 72, 153, 0.3);
      padding: 4px 14px;
      border-radius: 99px;
      margin-bottom: 12px;
      font-weight: 600;
    }
    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 26px;
    }
    .btn-stack { display: flex; flex-direction: column; gap: 10px; }
    .btn {
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      display: block;
      cursor: pointer;
      border: none;
    }
    .btn-glow {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #fff;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.35);
    }
    .btn-alt {
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    @keyframes rotateGrad {
      0% { background-position: 0% 50%; transform: rotate(0deg); }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>

  <div class="card">
    <div class="ring">
      <img class="photo" src="sister.jpg" alt="Pari" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400'">
    </div>
    <span class="badge">Birthday Queen</span>
    <h1>Happy Birthday! 🎂</h1>
    <p>Another chapter unsealed. Here's to louder laughs, bigger wins, and never losing your edge.</p>

    <div class="btn-stack">
      <button class="btn btn-alt" onclick="popMore()">Explode Fireworks 💥</button>
      <a href="message.html" class="btn btn-glow">Enter AI Oracle & Letter →</a>
    </div>
  </div>

  <script>
    const cvs = document.getElementById('fx');
    const ctx = cvs.getContext('2d');
    let sparks = [];

    function fit() { cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
    window.addEventListener('resize', fit);
    fit();

    function spawn(x, y, count = 40) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        sparks.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: Math.random() * 3 + 2,
          decay: Math.random() * 0.015 + 0.01,
          alpha: 1,
          color: ['#ec4899', '#38bdf8', '#facc15', '#c084fc', '#4ade80'][Math.floor(Math.random() * 5)]
        });
      }
    }

    function popMore() {
      spawn(cvs.width * 0.3, cvs.height * 0.4, 30);
      spawn(cvs.width * 0.7, cvs.height * 0.4, 30);
    }
    popMore();

    function render() {
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      sparks.forEach((s, idx) => {
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.12; // gravity
        s.alpha -= s.decay;

        ctx.save();
        ctx.globalAlpha = Math.max(0, s.alpha);
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (s.alpha <= 0) sparks.splice(idx, 1);
      });
      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
