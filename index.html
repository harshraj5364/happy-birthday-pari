<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Special Surprise</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      z-index: 1;
      pointer-events: none;
    }
    .orb-1 { width: 280px; height: 280px; background: #ec4899; top: 10%; left: 15%; }
    .orb-2 { width: 240px; height: 240px; background: #6366f1; bottom: 15%; right: 15%; }

    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 44px 28px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .gift-btn {
      background: none;
      border: none;
      font-size: 4.5rem;
      cursor: pointer;
      display: inline-block;
      margin-bottom: 20px;
      animation: float 2.6s ease-in-out infinite;
      transition: transform 0.2s;
    }
    .gift-btn:active { transform: scale(0.88); }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #fff 40%, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-action {
      display: inline-block;
      background: linear-gradient(135deg, #ec4899, #d946ef);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      padding: 14px 34px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(236, 72, 153, 0.35);
      border: none;
      cursor: pointer;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <button class="gift-btn" onclick="playChime()">🎁</button>
    <h1>Special Delivery</h1>
    <p>Incoming transmission for the official favorite sister. Tap below to verify identity.</p>
    <button class="btn-action" onclick="unlock()">Unlock Surprise →</button>
  </div>

  <script>
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function playChime() {
      if (ctx.state === 'suspended') ctx.resume();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
    }

    function unlock() {
      playChime();
      setTimeout(() => { window.location.href = 'wish.html'; }, 300);
    }
  </script>
</body>
</html>
